name: Fetch and Send Memes
on:
  schedule:
    - cron: '0 */6 * * *' # Triggers every 6 hours automatically
  workflow_dispatch: # Allows manual trigger

jobs:
  post-memes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and Post Meme
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -c "
          import requests
          import random
          import sys

          # Using a dedicated meme API that bypasses Reddit blocks
          subreddits = ['gamedevmemes', 'gamingmemes', 'programmerhumor']
          sub = random.choice(subreddits)
          
          url = f'https://meme-api.com/{sub}'
          res = requests.get(url)
          
          if res.status_code == 200:
              data = res.json()
              payload = {
                  'embeds': [{
                      'title': data.get('title', 'Meme Time!'),
                      'image': {'url': data.get('url')},
                      'footer': {'text': f'From r/{data.get(\"subreddit\")}'}
                  }]
              }
              requests.post('${{ secrets.DISCORD_WEBHOOK_URL }}', json=payload)
              print('Meme sent successfully via Meme-API!')
          else:
              print(f'API failed with status code: {res.status_code}')
              sys.exit(1)
          "
