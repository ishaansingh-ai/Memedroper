name: Fetch and Send Memes
on:
  schedule:
    - cron: '0 */6 * * *' # Triggers every 6 hours automatically
  workflow_dispatch: # Allows manual trigger

jobs:
  post-memes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and Post Meme
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -c "
          import requests
          import random
          import sys
          import os

          webhook = os.environ.get('DISCORD_WEBHOOK_URL')
          if not webhook:
              print('Error: DISCORD_WEBHOOK_URL is missing from GitHub Secrets!')
              sys.exit(1)

          subreddits = ['gamedevmemes', 'gamingmemes', 'programmerhumor']
          sub = random.choice(subreddits)
          
          url = 'https://meme-api.com/gimme/' + sub
          res = requests.get(url)
          
          if res.status_code == 200:
              data = res.json()
              payload = {
                  'embeds': [{
                      'title': data.get('title', 'Meme Time!'),
                      'image': {'url': data.get('url')},
                      'footer': {'text': 'From r/' + data.get('subreddit', sub)}
                  }]
              }
              requests.post(webhook, json=payload)
              print('Meme sent successfully!')
          else:
              print('API failed with status code:', res.status_code)
              sys.exit(1)
          "
