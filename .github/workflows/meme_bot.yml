name: Fetch and Send Memes
on:
  schedule:
    - cron: '0 */6 * * *' # Automatically drops a meme every 6 hours
  workflow_dispatch: # Allows you to manually trigger it for testing

jobs:
  post-memes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and Post Meme
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -c "
          import requests
          import random
          import sys
          import os

          webhook = os.environ.get('DISCORD_WEBHOOK_URL')
          if not webhook:
              print('CRITICAL ERROR: Discord Webhook URL is completely blank or missing from Secrets!')
              sys.exit(1)

          # Target subreddits using standard hot feeds
          subs = ['gamedevmemes', 'gamingmemes', 'programmerhumor']
          chosen_sub = random.choice(subs)
          
          url = f'https://www.reddit.com/r/{chosen_sub}/hot.json?limit=30'
          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) MemeBot/1.0'}
          
          try:
              res = requests.get(url, headers=headers).json()
              posts = res['data']['children']
          except Exception as e:
              print('Failed to reach server:', e)
              sys.exit(1)
          
          valid_links = []
          for post in posts:
              data = post['data']
              img_url = data.get('url', '')
              if img_url.endswith(('.jpg', '.jpeg', '.png', '.gif')) and not data.get('stickied'):
                  valid_links.append((data.get('title', 'Meme!'), img_url))
          
          if valid_links:
              title, meme_img = random.choice(valid_links)
              payload = {
                  'embeds': [{
                      'title': title,
                      'image': {'url': meme_img},
                      'footer': {'text': f'Fetched from r/{chosen_sub}'}
                  }]
              }
              requests.post(webhook, json=payload)
              print('Meme dispatched successfully to Discord!')
          else:
              print('No raw image posts found on the front page this time.')
              sys.exit(1)
          "
